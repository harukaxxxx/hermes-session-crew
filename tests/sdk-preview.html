<!doctype html><html><head><meta charset="utf-8"><title>SDK fixture — controlled pane</title><style>
:root{--ui-bg-elevated:#292a30;--ui-stroke-secondary:#575761;--ui-text-primary:#eeeaf1;--ui-text-secondary:#aaa6af;--ui-control-active-background:#45424d;--ui-success:#86c6ac;--ui-accent:#a7b9de;--ui-text-quaternary:#716d78}*{box-sizing:border-box}body{margin:0;background:#1d1c21;color:var(--ui-text-primary);font:14px system-ui}header{padding:12px 20px;color:var(--ui-text-secondary);border-bottom:1px solid var(--ui-stroke-secondary)}.workspace{display:flex;height:calc(100vh - 50px)}#pane{width:80px;flex:none;overflow:hidden;border-right:1px solid var(--ui-stroke-secondary)}.chat{padding:45px;max-width:750px;color:var(--ui-text-secondary)}.chat p{padding:18px;border-radius:12px;background:#29282f}button{font:inherit;color:inherit;cursor:pointer}.rail{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:18px}.avatar-hit{width:45px;height:37px;padding:0;border:0;background:transparent;display:grid;place-items:center}.avatar{width:37px;height:37px;border-radius:50%;border:2px solid var(--ui-stroke-secondary);object-fit:cover}.avatar-hit:not(:hover):not(:focus-visible):not([data-state="open"]) .avatar{clip-path:inset(0 0 0 30%)}.fallback{display:grid;place-items:center}.profile-bubble{z-index:50;width:288px;padding:16px;border-radius:12px;border:1px solid var(--ui-stroke-secondary);background:var(--ui-bg-elevated);color:var(--ui-text-primary);box-shadow:0 8px 24px #0005}.profile-name{font-size:16px}.quote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ui-text-secondary);font-size:12px;margin:6px 0 12px}.sessions{max-height:220px;overflow:auto}.session{display:flex;width:100%;justify-content:space-between;gap:10px;padding:10px 5px;border:0;border-bottom:1px solid var(--ui-stroke-secondary);background:transparent;text-align:left}.session small{color:var(--ui-text-secondary)}.more{display:block;margin:auto;border:0;background:transparent;font-size:20px}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.footer button,.projects button{background:var(--ui-control-active-background);border:0;border-radius:6px;padding:8px}.projects{display:flex;gap:6px;margin-top:8px}.profile-bubble > span > span{position:relative;display:block;width:16px;height:7px}.profile-bubble > span > span > span{position:absolute;top:0;left:50%;display:block;width:11px;height:11px;background:var(--ui-bg-elevated);border-right:1px solid var(--ui-stroke-secondary);border-bottom:1px solid var(--ui-stroke-secondary);transform:translate(-50%,-50%) rotate(45deg)}#events{font-size:11px;white-space:pre-wrap} [data-slot=popover-content]>span[style*="transform-origin"]>span{position:relative;display:block;width:16px;height:7px;overflow:visible}[data-slot=popover-content]>span[style*="transform-origin"]>span>span{position:absolute;top:0;left:50%;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ui-bg-elevated);border-right:1px solid var(--ui-stroke-secondary);border-bottom:1px solid var(--ui-stroke-secondary)} </style></head><body><header>Local fixture · real SDK Popover source · controlled 80px pane, not native Desktop</header><div class="workspace"><div id="pane"></div><main class="chat"><h2>Conversation</h2><p>This fixture represents the chat workspace. Opening a profile floats above this area without resizing it.</p><p>Profile names and actions here use synthetic fixture data.</p><pre id="events" hidden>[]</pre></main></div><script src="sdk-bundle.js"></script></body></html>
